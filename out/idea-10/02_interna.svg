<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- ===== estilos ===== -->
  <defs>
    <style>
      .bg { fill:#0F172A; }
      .rail { fill:#0B1221; opacity:.85; }
      .title { font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-weight:800; fill:#FFFFFF; }
      .panel { fill:#0B1221; stroke:#1F2635; stroke-width:2; }
      .bullet-text { font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#E6ECF3; }
    </style>
  </defs>

  <!-- ===== fondo y franja ===== -->
  <rect class="bg" x="0" y="0" width="1080" height="1080"/>
  <rect class="rail" x="0" y="0" width="120" height="1080"/>

  <!-- ===== título ===== -->
  <!-- Variables: BACKEND: FORTALEZAS, DE 5 LENGUAJES -->
  <g class="title" font-size="32" text-anchor="start">
    <text x="160" y="120">🎓 BACKEND: FORTALEZAS</text>
    <text x="160" y="180">DE 5 LENGUAJES</text>
  </g>

<!-- defs al comienzo del SVG -->
<defs>
  <!-- icon 28x28 -->
  <symbol id="bullet-check" viewBox="0 0 28 28">
    <circle cx="14" cy="14" r="11.5" fill="none" stroke="#48B0F7" stroke-width="2.5"/>
    <path d="M8 14 L12 18 L20 10"
          fill="none" stroke="#48B0F7" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</defs>

  <!-- ===== panel de lista ===== -->
  <g transform="translate(160,240)">
    <rect class="panel" x="0" y="0" rx="16" ry="16" width="760" height="760"/>

    <!-- Bullets -->
    
    
    <g transform="translate(32, 40)">
      <!-- icono bullet -->
      <use href="#bullet-check" x="16" y="12" width="28" height="28"/>




      <!-- texto -->
      <text x="50" y="34" class="bullet-text" font-size="32" xml:space="preserve">
        <tspan x="50" dy="0">Python: amigable y potente</tspan>
        
        
      </text>
    </g>
    
    <g transform="translate(32, 170)">
      <!-- icono bullet -->
      <use href="#bullet-check" x="16" y="12" width="28" height="28"/>




      <!-- texto -->
      <text x="50" y="34" class="bullet-text" font-size="32" xml:space="preserve">
        <tspan x="50" dy="0">Java: fuerte en rendimiento</tspan>
        
        
      </text>
    </g>
    
    <g transform="translate(32, 300)">
      <!-- icono bullet -->
      <use href="#bullet-check" x="16" y="12" width="28" height="28"/>




      <!-- texto -->
      <text x="50" y="34" class="bullet-text" font-size="32" xml:space="preserve">
        <tspan x="50" dy="0">PHP: facil de desplegar en hosting</tspan>
        
        
      </text>
    </g>
    
    <g transform="translate(32, 430)">
      <!-- icono bullet -->
      <use href="#bullet-check" x="16" y="12" width="28" height="28"/>




      <!-- texto -->
      <text x="50" y="34" class="bullet-text" font-size="32" xml:space="preserve">
        <tspan x="50" dy="0">Node.js: rapido con gran comunidad</tspan>
        
        
      </text>
    </g>
    
    <g transform="translate(32, 560)">
      <!-- icono bullet -->
      <use href="#bullet-check" x="16" y="12" width="28" height="28"/>




      <!-- texto -->
      <text x="50" y="34" class="bullet-text" font-size="32" xml:space="preserve">
        <tspan x="50" dy="0">Go: concurrente y ligero</tspan>
        
        
      </text>
    </g>
    
  </g>
</svg>